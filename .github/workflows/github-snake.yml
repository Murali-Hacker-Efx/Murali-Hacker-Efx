name: Generate Snake Animation

on:
  schedule:
    - cron: "0 4 * * *"   # once a day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Murali-Hacker-Efx
          outputs: |
            dist/github-snake.svg?color_snake=#ff2d95&color_dots=#2a1140,#7b2ff7,#a855f7,#ff6ec7,#ff2d95
            dist/github-snake-dark.svg?color_snake=#ff6ec7&color_dots=#1a0b2e,#3d1240,#7b2ff7,#c026a3,#ff2d95
            dist/github-snake-light.svg?color_snake=#d6006e&color_dots=#ffeaf6,#f3d5ff,#c084fc,#c026a3,#7b2ff7

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
