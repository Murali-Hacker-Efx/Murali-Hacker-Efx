<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160821"/><stop offset="100%" stop-color="#2a1140"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d95"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="495" height="195" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="495" height="195" fill="url(#bgGrad)"/>
    <rect width="495" height="195" fill="none" stroke="#ff6ec7" stroke-opacity="0.3"/>
    <text x="24" y="30" font-family="Segoe UI, Verdana, sans-serif" font-size="15" font-weight="700" fill="#ffffff">GitHub Stats</text>
    <text x="24" y="48" font-family="Consolas, Monaco, monospace" font-size="10.5" fill="#a855f7" opacity="0.85">@{{USERNAME}} &#8226; live via GitHub Actions</text>

    <g transform="translate(80,128)">
      <circle r="46" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="9"/>
      <circle r="46" fill="none" stroke="url(#ringGrad)" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="289.0" stroke-dashoffset="289.0" transform="rotate(-90)" filter="url(#glow)">
        <animate attributeName="stroke-dashoffset" values="289.0;{{RING_OFFSET}}" dur="1.4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.6 0.3 1"/>
      </circle>
      <text x="0" y="-2" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#ffffff">{{RANK}}</text>
      <text x="0" y="16" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#a855f7">RANK</text>
    </g>

    
    <g transform="translate(170,20)" opacity="0">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="40 0;0 0" dur="0.5s" begin="0.90s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.90s" fill="freeze"/>
      <text x="0" y="0" font-family="Segoe UI, Verdana, sans-serif" font-size="13.5" fill="#e7d6f5">Repositories</text>
      <text x="300" y="0" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="14" font-weight="700" fill="#ff6ec7">{{REPOS}}</text>
    </g>
    <g transform="translate(170,58)" opacity="0">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="40 0;0 0" dur="0.5s" begin="1.05s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.05s" fill="freeze"/>
      <text x="0" y="0" font-family="Segoe UI, Verdana, sans-serif" font-size="13.5" fill="#e7d6f5">Total Contributions</text>
      <text x="300" y="0" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="14" font-weight="700" fill="#ff6ec7">{{CONTRIB}}</text>
    </g>
    <g transform="translate(170,96)" opacity="0">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="40 0;0 0" dur="0.5s" begin="1.20s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.20s" fill="freeze"/>
      <text x="0" y="0" font-family="Segoe UI, Verdana, sans-serif" font-size="13.5" fill="#e7d6f5">Total Stars</text>
      <text x="300" y="0" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="14" font-weight="700" fill="#ff6ec7">{{STARS}}</text>
    </g>
    <g transform="translate(170,134)" opacity="0">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="40 0;0 0" dur="0.5s" begin="1.35s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.35s" fill="freeze"/>
      <text x="0" y="0" font-family="Segoe UI, Verdana, sans-serif" font-size="13.5" fill="#e7d6f5">Followers</text>
      <text x="300" y="0" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="14" font-weight="700" fill="#ff6ec7">{{FOLLOWERS}}</text>
    </g>
  </g>
</svg>